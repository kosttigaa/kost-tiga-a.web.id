<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Log Akses | Kost Tiga A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f5ff;
      --ink: #251d38;
      --muted: #6d667d;
      --line: #e8e1f2;
      --blue: #5339c0;
      --acid: #dcfa67;
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(ellipse at 8% 0, rgb(114 85 232 / 10%), transparent 30rem), var(--paper); }
    header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 max(24px, calc((100% - 1120px) / 2)); border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 80%); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; font-family: Manrope, sans-serif; font-weight: 800; }
    .mark { display: grid; width: 36px; aspect-ratio: 1; place-items: center; border: 2px solid var(--ink); border-radius: 12px; background: var(--acid); font-size: 12px; transform: rotate(-5deg); }
    .private-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    main { width: min(1120px, calc(100% - 40px)); margin: 48px auto; }
    .eyebrow { margin: 0 0 8px; color: var(--blue); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    nav.admin-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
    nav.admin-nav a { padding: 8px 14px; border: 1px solid #d7cfe5; border-radius: 6px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: none; }
    nav.admin-nav a:hover { border-color: var(--blue); color: var(--blue); }
    nav.admin-nav a[aria-current=page] { border-color: var(--ink); background: var(--ink); color: #fff; }
    h1 { margin: 0; font-family: Manrope, sans-serif; font-size: clamp(26px, 4vw, 34px); line-height: 1.15; }
    .intro { margin: 10px 0 26px; color: var(--muted); font-size: 14px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .search { flex: 1; min-width: 0; }
    input { width: 100%; min-height: 42px; padding: 0 13px; border: 1px solid #d7cfe5; border-radius: 6px; background: #fff; color: var(--ink); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #9b87f0; outline-offset: 2px; }
    button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--ink); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--blue); }
    #status { min-height: 22px; margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: white; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #eeeaf4; vertical-align: top; }
    th { position: sticky; top: 0; background: #f1ecfb; color: #403657; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    tbody tr:last-child td { border-bottom: 0; }
    .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 14px; }
    .pagination button { min-height: 38px; padding-inline: 12px; }
    .pagination button:disabled { background: #d8d3e1; color: #6d667d; cursor: not-allowed; }
    #page-info { min-width: 110px; color: var(--muted); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
    td.ip, td.time, td.status-code { white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.path { min-width: 180px; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    td.browser { min-width: 140px; }
    .empty { padding: 28px 14px; color: var(--muted); text-align: center; }
    @media (max-width: 600px) {
      header { min-height: 60px; padding-inline: 16px; }
      main { width: calc(100% - 28px); margin: 32px auto; }
      .toolbar { align-items: stretch; }
      button { padding-inline: 12px; }
      th, td { padding: 10px; }
      table { min-width: 650px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><span class="mark">3A</span><span>Kost Tiga A</span></a>
    <span class="private-label">PANEL PRIVAT</span>
  </header>
  <main>
    <nav class="admin-nav" aria-label="Menu admin">
      <a href="/admin/logs" aria-current="page">Log akses</a>
      <a href="/admin/stats">Statistik</a>
      <a href="/admin/kamar">Kamar kosong</a>
    </nav>
    <p class="eyebrow">Administrasi situs</p>
    <h1>Log akses pengunjung</h1>
    <p class="intro">Permintaan terbaru ke situs ini. Alamat IP dan waktu mengikuti catatan server.</p>
    <div class="toolbar">
      <label class="search"><input id="search" type="search" placeholder="Cari IP, halaman, atau browser" autocomplete="off" aria-label="Cari IP, halaman, atau browser"></label>
      <button id="refresh" type="button">Muat ulang</button>
    </div>
    <p id="status" role="status" aria-live="polite">Memuat log...</p>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">IP</th><th scope="col">Waktu server</th><th scope="col">Halaman</th><th scope="col">Browser</th><th scope="col">Metode</th><th scope="col">Status</th></tr></thead>
        <tbody id="entries"><tr><td class="empty" colspan="6">Memuat log...</td></tr></tbody>
      </table>
    </div>
    <nav class="pagination" aria-label="Navigasi halaman log">
      <button id="previous-page" type="button" aria-label="Halaman sebelumnya">Sebelumnya</button>
      <span id="page-info" aria-live="polite">Halaman 1 dari 1</span>
      <button id="next-page" type="button" aria-label="Halaman berikutnya">Berikutnya</button>
    </nav>
  </main>
  <script>
    const logUrl = "/admin/logs/data";
    const pageSize = 50;
    const statusElement = document.getElementById("status");
    const entriesElement = document.getElementById("entries");
    const searchElement = document.getElementById("search");
    const previousPageButton = document.getElementById("previous-page");
    const nextPageButton = document.getElementById("next-page");
    const pageInfoElement = document.getElementById("page-info");
    let entries = [];
    let currentPage = 1;

    function parseLog(text) {
      return text.trim().split("\n").filter(Boolean).map((line) => {
        const match = line.match(/^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+)(?: [^"]*)?" (\d{3}) \S+ "[^"]*" "([^"]*)"$/);
        return match ? {
          ip: match[1],
          time: match[2],
          method: match[3],
          path: match[4],
          status: match[5],
          browser: getBrowser(match[6])
        } : null;
      }).filter(Boolean).reverse();
    }

    function getBrowser(userAgent) {
      const browsers = [
        ["Edge", /Edg(?:e|A|iOS)?\/([\d.]+)/],
        ["Opera", /(?:OPR|Opera)\/([\d.]+)/],
        ["Samsung Internet", /SamsungBrowser\/([\d.]+)/],
        ["Firefox", /(?:Firefox|FxiOS)\/([\d.]+)/],
        ["Chrome", /(?:Chrome|CriOS)\/([\d.]+)/],
        ["Safari", /Version\/([\d.]+).*Safari/]
      ];

      for (const [name, pattern] of browsers) {
        const match = userAgent.match(pattern);
        if (match) return `${name} ${match[1]}`;
      }

      return "Tidak diketahui";
    }

    function renderEntries() {
      const query = searchElement.value.trim().toLowerCase();
      const visibleEntries = entries.filter((entry) => `${entry.ip} ${entry.path} ${entry.browser} ${entry.method} ${entry.status}`.toLowerCase().includes(query));
      const totalPages = Math.max(1, Math.ceil(visibleEntries.length / pageSize));
      currentPage = Math.min(currentPage, totalPages);
      const startIndex = (currentPage - 1) * pageSize;
      const pageEntries = visibleEntries.slice(startIndex, startIndex + pageSize);
      entriesElement.replaceChildren();
      pageInfoElement.textContent = `Halaman ${currentPage} dari ${totalPages}`;
      previousPageButton.disabled = currentPage === 1;
      nextPageButton.disabled = currentPage === totalPages;
      statusElement.textContent = visibleEntries.length
        ? `Menampilkan ${startIndex + 1}-${startIndex + pageEntries.length} dari ${visibleEntries.length} request.`
        : `Menampilkan 0 dari ${entries.length ? "hasil pencarian" : "request"}.`;

      if (!pageEntries.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.className = "empty";
        cell.colSpan = 6;
        cell.textContent = entries.length ? "Tidak ada hasil yang cocok." : "Belum ada request tercatat.";
        row.append(cell);
        entriesElement.append(row);
        return;
      }

      for (const entry of pageEntries) {
        const row = document.createElement("tr");
        for (const [value, className] of [[entry.ip, "ip"], [entry.time, "time"], [entry.path, "path"], [entry.browser, "browser"], [entry.method, ""], [entry.status, "status-code"]]) {
          const cell = document.createElement("td");
          cell.className = className;
          cell.textContent = value;
          row.append(cell);
        }
        entriesElement.append(row);
      }
    }

    async function loadLog() {
      statusElement.textContent = "Memuat log...";
      try {
        const response = await fetch(logUrl, { cache: "no-store", credentials: "same-origin" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        entries = parseLog(await response.text()).slice(0, 1000);
        currentPage = 1;
        renderEntries();
      } catch {
        entries = [];
        currentPage = 1;
        renderEntries();
        statusElement.textContent = "Log gagal dimuat. Pastikan autentikasi berhasil, lalu coba muat ulang.";
      }
    }

    document.getElementById("refresh").addEventListener("click", loadLog);
    previousPageButton.addEventListener("click", () => {
      currentPage -= 1;
      renderEntries();
    });
    nextPageButton.addEventListener("click", () => {
      currentPage += 1;
      renderEntries();
    });
    searchElement.addEventListener("input", () => {
      currentPage = 1;
      renderEntries();
    });
    loadLog();
  </script>
</body>
</html>
